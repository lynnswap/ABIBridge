name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prior-validation:
    name: Look for a validated tree
    # A pull request's run validates the tree that its merge produces. When the
    # pull request was up to date, the merge commit pushed to main has that tree.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      validated: ${{ steps.lookup.outputs.validated }}
    steps:
      - name: Find the pull request run that validated this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Any failed lookup leaves the tree unvalidated, so every job runs.
          task_validated=false
          if [[ "$EVENT_NAME" == push ]]; then
            task_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" \
              --jq '"\(.tree.sha) \(.parents[1].sha // "")"' || true)
            read -r task_tree task_head <<< "$task_commit" || true
            task_run=
            if [[ -n "$task_tree" && -n "$task_head" ]]; then
              # A run names the tree itself, so the record counts only from a
              # run for the commit that this merge brought in: a pull request
              # cannot vouch for a tree that its own merge did not produce.
              task_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-validated-tree-$task_tree" \
                --jq '.artifacts[] | select(.expired == false and .workflow_run.repository_id == .workflow_run.head_repository_id) | "\(.workflow_run.head_sha) \(.workflow_run.id)"' \
                | awk -v head="$task_head" '$1 == head { print $2; exit }' || true)
            fi
            if [[ -n "$task_run" ]]; then
              task_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$task_run" \
                --jq '"\(.event) \(.conclusion) \(.path)"' || true)
              if [[ "$task_state" == "pull_request success .github/workflows/ci.yml" ]]; then
                task_validated=true
                echo "Run $task_run validated tree $task_tree."
              fi
            fi
          fi
          echo "validated=$task_validated" >> "$GITHUB_OUTPUT"

  release-tests:
    name: Release and CI automation tests
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the dispatching automation, including for older release targets.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  runtime-tests:
    name: Runtime and consumers (Xcode ${{ matrix.xcode }})
    needs: prior-validation
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action != 'closed') && needs.prior-validation.outputs.validated != 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26.6'
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
          - xcode: '27.0'
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          echo "ABI_TEST_BUILD_DIR=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "ABI_CONSUMER_BUILD_DIR=$RUNNER_TEMP/NativeConsumer" >> "$GITHUB_ENV"
      - name: Test Core and Runtime on macOS
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          if [[ -d Sources/ABIBridgeRuntime ]]; then
            bash scripts/test-package.sh runtime
          else
            # Older release targets keep their original package suite.
            xcodebuild test -scheme ABIBridge \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$ABI_TEST_BUILD_DIR"
          fi
      - name: Test public compiler boundaries and optimized native linkage
        if: ${{ !cancelled() && matrix.xcode == '27.0' }}
        timeout-minutes: 25
        run: |
          if [[ -d Sources/ABIBridgeRuntime ]]; then
            bash scripts/test-native-consumer.sh focused
          else
            bash scripts/test-native-consumer.sh
          fi
      - name: Check Swift compiler codegen
        # Release targets can predate the codegen runner.
        if: ${{ !cancelled() && hashFiles('scripts/test-codegen.sh') != '' }}
        timeout-minutes: 20
        run: bash scripts/test-codegen.sh
      - name: Test SwiftUI public consumer
        if: ${{ !cancelled() && matrix.xcode == '27.0' && hashFiles('Sources/ABIBridgeRuntime/*.swift') != '' }}
        timeout-minutes: 10
        run: bash scripts/test-native-consumer.sh swiftui
      - name: Test native consumers and iOS Simulator
        if: ${{ !cancelled() && matrix.xcode == '26.6' }}
        timeout-minutes: 35
        run: |
          task_status=0
          task_consumer_log="$RUNNER_TEMP/native-consumer-xcode-26.6.log"
          (
            if [[ -d Sources/ABIBridgeRuntime ]]; then
              bash scripts/test-native-consumer.sh focused
            else
              bash scripts/test-native-consumer.sh
            fi
          ) > "$task_consumer_log" 2>&1 &
          task_consumer_pid=$!
          if [[ -f scripts/test-simulators.py ]]; then
            task_options=()
            if [[ -d Sources/ABIBridgeRuntime ]]; then
              task_options+=(--scheme ABIBridgeRuntime --skip-swiftui-build)
            fi
            if ! python3 scripts/test-simulators.py --platforms iOS \
              --build-dir "$ABI_TEST_BUILD_DIR" \
              --result-dir "$RUNNER_TEMP/SimulatorResults" "${task_options[@]}"; then
              task_status=1
            fi
          fi
          if ! wait "$task_consumer_pid"; then task_status=1; fi
          cat "$task_consumer_log"
          exit "$task_status"
      - name: Clean up interrupted Simulator tests
        if: always()
        run: |
          if compgen -G "$RUNNER_TEMP/SimulatorResults/*.device.json" > /dev/null; then
            python3 scripts/test-simulators.py --cleanup --result-dir "$RUNNER_TEMP/SimulatorResults"
          fi
      - name: Preserve failed test diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-tests-xcode-${{ matrix.xcode }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/SimulatorResults
            ${{ runner.temp }}/DerivedData/Logs/Test
            ${{ runner.temp }}/native-consumer-xcode-26.6.log
          if-no-files-found: warn
          retention-days: 7

  public-api-tests:
    name: Public API (Xcode 27.0)
    needs: prior-validation
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action != 'closed') && needs.prior-validation.outputs.validated != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          echo "ABI_TEST_BUILD_DIR=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
      - name: Check whitespace and manifest
        run: |
          git diff --check HEAD^ HEAD
          xcrun swift package dump-package
      - name: Test public API behavior
        if: ${{ !cancelled() && hashFiles('Sources/ABIBridgeRuntime/*.swift') != '' }}
        timeout-minutes: 25
        env:
          ABI_TEST_PARALLEL_API: '1'
        run: bash scripts/test-package.sh api
      - name: Preserve failed test diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-tests-xcode-27.0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/DerivedData/Logs/Test
          if-no-files-found: warn
          retention-days: 7

  platform-builds:
    name: Apple device SDK builds (${{ matrix.platforms }}, Xcode 27.0)
    needs: prior-validation
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action != 'closed') && needs.prior-validation.outputs.validated != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      ABI_DEVICE_PLATFORMS: ${{ matrix.platforms }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platforms: iOS tvOS
            simulator: false
          - platforms: visionOS watchOS
            simulator: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build Apple platforms
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: |
          task_status=0
          read -r -a task_platforms <<< "$ABI_DEVICE_PLATFORMS"
          # Keep both SDK schemes uninstrumented so their dependencies can be reused.
          for task_platform in "${task_platforms[@]}"; do
            echo "::group::Build $task_platform"
            if ! xcodebuild build -scheme ABIBridge \
              -destination "generic/platform=$task_platform" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              WATCHOS_DEPLOYMENT_TARGET=11.4 CODE_SIGNING_ALLOWED=NO ENABLE_CODE_COVERAGE=NO; then
              task_status=1
            fi
            if [[ "$task_platform" == iOS ]]; then
              if ! ABI_VALIDATION_BUILD_DIR="$RUNNER_TEMP/DerivedData" \
                bash scripts/build-device-validation.sh arm64 CODE_SIGNING_ALLOWED=NO; then
                task_status=1
              fi
            fi
            # Release targets can predate the optional SwiftUI product.
            if compgen -G 'Sources/ABIBridgeSwiftUI/*.swift' > /dev/null; then
              if ! xcodebuild build -scheme ABIBridgeSwiftUI \
                -destination "generic/platform=$task_platform" \
                -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                WATCHOS_DEPLOYMENT_TARGET=11.4 CODE_SIGNING_ALLOWED=NO ENABLE_CODE_COVERAGE=NO; then
                task_status=1
              fi
            fi
            echo "::endgroup::"
          done
          exit "$task_status"
      - name: Test Core and Runtime on iOS Simulator
        if: ${{ !cancelled() && matrix.simulator && hashFiles('scripts/test-simulators.py') != '' }}
        timeout-minutes: 35
        run: |
          task_options=()
          if [[ -d Sources/ABIBridgeRuntime ]]; then
            task_options+=(--scheme ABIBridgeRuntime --skip-swiftui-build)
          fi
          python3 scripts/test-simulators.py --platforms iOS \
            --build-dir "$RUNNER_TEMP/DerivedData" \
            --result-dir "$RUNNER_TEMP/SimulatorResults" "${task_options[@]}"
      - name: Clean up interrupted Simulator tests
        if: always()
        run: |
          if compgen -G "$RUNNER_TEMP/SimulatorResults/*.device.json" > /dev/null; then
            python3 scripts/test-simulators.py --cleanup --result-dir "$RUNNER_TEMP/SimulatorResults"
          fi
      - name: Preserve failed Simulator diagnostics
        if: always() && (failure() || cancelled()) && matrix.simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-tests-xcode-27.0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/SimulatorResults
            ${{ runner.temp }}/DerivedData/Logs/Test
          if-no-files-found: warn
          retention-days: 7

  validated-tree:
    name: Record the validated tree
    needs: [release-tests, runtime-tests, public-api-tests, platform-builds]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Name the tree this run validated
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "$task_tree" > "$RUNNER_TEMP/validated-tree"
          echo "sha=$task_tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-validated-tree-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/validated-tree
          overwrite: true
          retention-days: 7
