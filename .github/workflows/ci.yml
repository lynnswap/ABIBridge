name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.ref }}
  cancel-in-progress: true

# macos-26 is an arm64 runner; Xcode 26.6 includes Swift 6.3 and all five SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release-tests:
    name: Release automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the dispatching automation, including for older release targets.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release.py' -v

  macos-tests:
    name: macOS tests (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [Core, Invocation, Hooks, Optimized bridge, Native consumers, Architecture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check whitespace and manifest
        if: matrix.suite == 'Core'
        run: |
          git diff --check HEAD^ HEAD
          xcrun swift package dump-package
      - name: Test package shard
        id: package-tests
        timeout-minutes: 18
        if: contains(fromJSON('["Core", "Invocation", "Hooks"]'), matrix.suite)
        env:
          PACKAGE_SUITE: ${{ matrix.suite }}
          ABI_TEST_BUILD_DIR: ${{ runner.temp }}/DerivedData
        run: |
          if [[ -f scripts/test-package.sh ]]; then
            bash scripts/test-package.sh "$(printf '%s' "$PACKAGE_SUITE" | tr '[:upper:]' '[:lower:]')"
          elif [[ "$PACKAGE_SUITE" == Core ]]; then
            # Release validation can check out a revision older than the shard script.
            xcodebuild test -scheme ABIBridge \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$ABI_TEST_BUILD_DIR"
          fi
      - name: Preserve failed package test diagnostics
        if: always() && contains(fromJSON('["Core", "Invocation", "Hooks"]'), matrix.suite) && steps.package-tests.outcome != 'success' && steps.package-tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-test-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/DerivedData/Logs/Test
          if-no-files-found: warn
          retention-days: 7
      - name: Test optimized native bridge
        if: matrix.suite == 'Optimized bridge'
        run: >-
          xcodebuild test
          -configuration Release
          -scheme ABIBridge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:ABIBridgeTests/NativeRuntimeTests
      - name: Test native consumers
        if: matrix.suite == 'Native consumers'
        run: bash scripts/test-native-consumer.sh
      - name: Test architecture fixtures on macOS
        if: matrix.suite == 'Architecture'
        working-directory: Tests/ArchitectureValidation
        run: >-
          xcodebuild test
          -scheme ArchitectureValidation-Package
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/ArchitectureValidation"
      - name: Check arm64 and arm64e code generation
        if: matrix.suite == 'Architecture'
        run: python3 scripts/check-architecture-codegen.py

  platform-builds:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, visionOS, watchOS, tvOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build package products
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          xcodebuild build
          -scheme ABIBridge
          -destination "generic/platform=$PLATFORM"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          WATCHOS_DEPLOYMENT_TARGET=11.4
          CODE_SIGNING_ALLOWED=NO
      - name: Build physical-device validation host
        if: matrix.platform == 'iOS'
        run: >-
          ABI_VALIDATION_BUILD_DIR="$RUNNER_TEMP/DerivedData"
          bash scripts/build-device-validation.sh arm64
          CODE_SIGNING_ALLOWED=NO
      - name: Build optional SwiftUI product
        # Release validation may check out a revision from before this product existed.
        if: hashFiles('Sources/ABIBridgeSwiftUI/*.swift') != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          xcodebuild build
          -scheme ABIBridgeSwiftUI
          -destination "generic/platform=$PLATFORM"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          WATCHOS_DEPLOYMENT_TARGET=11.4
          CODE_SIGNING_ALLOWED=NO
