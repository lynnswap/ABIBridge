name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.ref }}
  cancel-in-progress: true

# macos-26 is an arm64 runner; Xcode 26.6 includes Swift 6.3 and all five SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release-tests:
    name: Release automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the dispatching automation, including for older release targets.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release.py' -v

  macos-tests:
    name: macOS tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check whitespace and manifest
        run: |
          git diff --check HEAD^ HEAD
          xcrun swift package dump-package
      - name: Test package
        run: >-
          xcodebuild test
          -scheme ABIBridge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - name: Test optimized native bridge
        run: >-
          xcodebuild test
          -configuration Release
          -scheme ABIBridge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:ABIBridgeTests/NativeRuntimeTests
      - name: Test native consumers
        run: bash scripts/test-native-consumer.sh
      - name: Test architecture fixtures on macOS
        working-directory: Tests/ArchitectureValidation
        run: >-
          xcodebuild test
          -scheme ArchitectureValidation-Package
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/ArchitectureValidation"
      - name: Check arm64 and arm64e code generation
        run: python3 scripts/check-architecture-codegen.py

  platform-builds:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, visionOS, watchOS, tvOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build package products
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          xcodebuild build
          -scheme ABIBridge
          -destination "generic/platform=$PLATFORM"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          WATCHOS_DEPLOYMENT_TARGET=11.4
          CODE_SIGNING_ALLOWED=NO
