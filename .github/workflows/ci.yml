name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# macos-26 is an arm64 runner; Xcode 26.6 includes Swift 6.3 and all five SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release-tests:
    name: Release automation tests
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the dispatching automation, including for older release targets.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release.py' -v

  macos-tests:
    name: macOS tests (${{ matrix.group }})
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [Package, Native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          echo "ABI_TEST_BUILD_DIR=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
      - name: Check whitespace and manifest
        if: matrix.group == 'Package'
        run: |
          git diff --check HEAD^ HEAD
          xcrun swift package dump-package
      - name: Test core package shard
        if: ${{ !cancelled() && matrix.group == 'Package' }}
        timeout-minutes: 25
        run: |
          if [[ -f scripts/test-package.sh ]]; then
            bash scripts/test-package.sh core
          else
            # Release targets can predate the shard script.
            xcodebuild test -scheme ABIBridge \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$ABI_TEST_BUILD_DIR"
          fi
      - name: Test invocation package shard
        if: ${{ !cancelled() && matrix.group == 'Package' && hashFiles('scripts/test-package.sh') != '' }}
        timeout-minutes: 25
        run: bash scripts/test-package.sh invocation
      - name: Test hooks package shard
        if: ${{ !cancelled() && matrix.group == 'Package' && hashFiles('scripts/test-package.sh') != '' }}
        timeout-minutes: 25
        run: bash scripts/test-package.sh hooks
      - name: Test optimized native bridge
        if: ${{ !cancelled() && matrix.group == 'Package' }}
        timeout-minutes: 15
        run: >-
          xcodebuild test
          -configuration Release
          -scheme ABIBridge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$ABI_TEST_BUILD_DIR"
          -only-testing:ABIBridgeTests/NativeRuntimeTests
      - name: Preserve failed package test diagnostics
        if: always() && matrix.group == 'Package' && (failure() || cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/DerivedData/Logs/Test
          if-no-files-found: warn
          retention-days: 7
      - name: Test native consumers
        if: ${{ !cancelled() && matrix.group == 'Native' }}
        timeout-minutes: 25
        run: bash scripts/test-native-consumer.sh
      - name: Test architecture fixtures on macOS
        if: ${{ !cancelled() && matrix.group == 'Native' }}
        timeout-minutes: 15
        working-directory: Tests/ArchitectureValidation
        run: >-
          xcodebuild test
          -scheme ArchitectureValidation-Package
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/ArchitectureValidation"
      - name: Check arm64 and arm64e code generation
        if: ${{ !cancelled() && matrix.group == 'Native' }}
        run: python3 scripts/check-architecture-codegen.py

  platform-builds:
    name: Apple platform builds
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build all Apple platforms
        run: |
          task_status=0
          for task_platform in iOS visionOS watchOS tvOS; do
            echo "::group::Build $task_platform"
            if ! xcodebuild build -scheme ABIBridge \
              -destination "generic/platform=$task_platform" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              WATCHOS_DEPLOYMENT_TARGET=11.4 CODE_SIGNING_ALLOWED=NO; then
              task_status=1
            fi
            if [[ "$task_platform" == iOS ]]; then
              if ! ABI_VALIDATION_BUILD_DIR="$RUNNER_TEMP/DerivedData" \
                bash scripts/build-device-validation.sh arm64 CODE_SIGNING_ALLOWED=NO; then
                task_status=1
              fi
            fi
            # Release targets can predate the optional SwiftUI product.
            if compgen -G 'Sources/ABIBridgeSwiftUI/*.swift' > /dev/null; then
              if ! xcodebuild build -scheme ABIBridgeSwiftUI \
                -destination "generic/platform=$task_platform" \
                -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                WATCHOS_DEPLOYMENT_TARGET=11.4 CODE_SIGNING_ALLOWED=NO; then
                task_status=1
              fi
            fi
            echo "::endgroup::"
          done
          exit "$task_status"
